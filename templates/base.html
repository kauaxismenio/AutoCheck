{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f28c18">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
  <link rel="manifest" href="{% url 'core:manifest' %}">
  <link rel="icon" href="{% static 'img/icons/icon-192.png' %}" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'img/icons/icon-192.png' %}">
  <script src="{% static 'js/sidebar-init.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/attendance.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}
  <main class="page">
    {% include "partials/messages.html" %}
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
  <script src="{% static 'js/masks.js' %}" defer></script>
  <script src="{% static 'js/app-shell.js' %}" defer></script>
  <script src="{% static 'js/confirm.js' %}" defer></script>
  <script src="{% static 'js/pwa.js' %}" data-sw-url="{% url 'core:sw' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
