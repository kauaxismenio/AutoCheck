<div class="field{% if field.errors %} field--error{% endif %}{% if wrapper_class %} {{ wrapper_class }}{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required or force_required %} <span class="required" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="field__help">{{ field.help_text }}</small>{% endif %}
  <small class="field__hint" data-field-hint></small>
  {% for error in field.errors %}<small class="field__error">{{ error }}</small>{% endfor %}
</div>
