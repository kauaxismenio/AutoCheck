{% if page.has_other_pages %}
<nav class="pagination" aria-label="Paginação">
  {% if page.has_previous %}<a class="btn btn--sm" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}pagina={{ page.previous_page_number }}">‹ Anterior</a>{% endif %}
  <span class="muted">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn--sm" href="?{% if query_string %}{{ query_string }}&amp;{% endif %}pagina={{ page.next_page_number }}">Próxima ›</a>{% endif %}
</nav>
{% endif %}
